name: gymmane
description: "GymMane — an offline, ad-free gym log for Android and iOS."
publish_to: 'none'
version: 2.2.0+13

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.1.0
  file_picker: ^8.1.7
  flutter_local_notifications: ^22.0.1
  home_widget: ^0.7.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.0.0
  share_plus: ^12.0.2
  shared_preferences: ^2.3.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.9.2
  archive: ^4.0.9
  sync:
    path: packages/sync
  barcode: ^2.2.9
  zxing2: ^0.2.4
  app_settings: ^8.0.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/enogym_legacy.png
  image_path_ios: assets/brand/enogym_square.png
  adaptive_icon_background: '#103D2C'
  adaptive_icon_foreground: assets/brand/enogym_foreground.png
  adaptive_icon_monochrome: assets/brand/enogym_monochrome.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 24

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true

  assets:
    - own.properties
    - docs/releases/
    - docs/upstream-releases.json
    - assets/brand/enogym_foreground.png
    - assets/brand/enogym_icon.png
    - assets/brand/enogym_mark.png
    - assets/img/
    - assets/art/
    - assets/audio/
    - assets/badges/
    - assets/data/
    - assets/food/

  shaders:
    - assets/shaders/medal.frag
    - assets/shaders/edge_fade.frag

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
